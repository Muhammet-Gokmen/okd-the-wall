apiVersion: apps/v1
kind: Deployment
metadata:
  name: wall-db
  labels:
    app.kubernetes.io/part-of: the-wall
    app.kubernetes.io/name: wall-db
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: wall-db
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: the-wall
        app.kubernetes.io/name: wall-db
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgresql
          image: quay.io/kurs/postgresql:2026-10-29
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: walldb
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: wall-db-credentials
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wall-db-credentials
                  key: password
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: wall-db-data
