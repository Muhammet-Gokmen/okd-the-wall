apiVersion: apps/v1
kind: Deployment
metadata:
  name: wall-web
  labels:
    app.kubernetes.io/part-of: the-wall
    app.kubernetes.io/name: wall-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: wall-web
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: the-wall
        app.kubernetes.io/name: wall-web
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: docker.io/muhammetgokmen/the-wall:v1
          ports:
            - name: http
              containerPort: 8080
          envFrom:

            - configMapRef:
                name: wall-config
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: wall-db-credentials
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wall-db-credentials
                  key: password
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
