apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: wall-web
  labels:
    app.kubernetes.io/part-of: the-wall
    app.kubernetes.io/name: wall-web
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: wall-web
  minReplicas: 2
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 60
