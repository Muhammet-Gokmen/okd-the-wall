apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: wall-db-allow-web
  labels:
    app.kubernetes.io/part-of: the-wall
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: wall-db
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: wall-web
      ports:
        - protocol: TCP
          port: 5432
