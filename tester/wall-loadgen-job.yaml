apiVersion: batch/v1
kind: Job
metadata:
  name: wall-loadgen
  labels:
    app.kubernetes.io/part-of: the-wall
    app.kubernetes.io/name: wall-loadgen
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 1800
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: the-wall
        app.kubernetes.io/name: wall-loadgen
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: loadgen
          image: docker.io/muhammetgokmen/the-wall:v1
          command: ["python", "/scripts/loadgen.py"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: script
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: script
          configMap:
            name: wall-loadgen
